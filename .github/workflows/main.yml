name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Create Project Files
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/wocabeehelper
          mkdir -p app/src/main/res/raw

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WocaAuto"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.wocabeehelper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wocabeehelper"
                  minSdk 26
                  targetSdk 34
                  versionCode 13
                  versionName "13.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="WocaAuto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/raw/bot.js
          (function() {
              if (window._wocaBusy) return "BUSY";
              const dict = {
                  "nula": "zero", "zero": "nula",
                  "jedna": "one", "one": "jedna",
                  "dvě": "two", "dve": "two", "two": "dvě",
                  "tři": "three", "tri": "three", "three": "tři",
                  "čtyři": "four", "ctyri": "four", "four": "čtyři",
                  "pět": "five", "pet": "five", "five": "pět",
                  "šest": "six", "sest": "six", "six": "šest",
                  "sedm": "seven", "seven": "sedm",
                  "osm": "eight", "eight": "osm",
                  "devět": "nine", "devet": "nine", "nine": "devět",
                  "deset": "ten", "ten": "deset"
              };

              function isVis(el) {
                  if (!el) return false;
                  const r = el.getBoundingClientRect();
                  const s = window.getComputedStyle(el);
                  return r.width > 0 &&
                      r.height > 0 &&
                      s.visibility !== 'hidden' &&
                      s.display !== 'none';
              }

              const allInputs = Array.from(
                  document.querySelectorAll('input, textarea')
              ).filter(e =>
                  isVis(e) &&
                  !e.disabled &&
                  !e.readOnly &&
                  e.type !== 'hidden' &&
                  e.type !== 'submit' &&
                  e.type !== 'button' &&
                  e.type !== 'checkbox' &&
                  e.type !== 'radio' &&
                  e.type !== 'password'
              );

              if (allInputs.length === 0) {
                  const nextBtns = document.querySelectorAll(
                      'button, a, div.btn, span.btn'
                  );
                  for (const b of nextBtns) {
                      if (!isVis(b)) continue;
                      const t = (b.innerText || '').trim().toLowerCase();
                      if (
                          t === 'pokračovat' ||
                          t === 'continue' ||
                          t === 'další' ||
                          t === 'next'
                      ) {
                          b.click();
                          return "CONTINUE";
                      }
                  }
                  return "NO_INPUT";
              }

              const inp = allInputs[0];
              const ir = inp.getBoundingClientRect();
              const curVal = (inp.value || '').trim().toLowerCase();

              let ans = null;
              let foundWord = "";
              let bestDist = 999999;

              const allEls = document.querySelectorAll(
                  'div, span, p, h1, h2, h3, h4, h5, b, strong, label, td'
              );
              for (const el of allEls) {
                  if (!isVis(el)) continue;
                  if (el === inp || el.contains(inp)) continue;
                  const raw = (el.innerText || '')
                      .trim()
                      .toLowerCase()
                      .replace(/[?.!,]/g, '')
                      .trim();
                  if (!raw || raw.length > 15) continue;
                  if (raw === curVal) continue;

                  if (dict[raw]) {
                      const r = el.getBoundingClientRect();
                      const dy = Math.abs(r.bottom - ir.top);
                      const dx = Math.abs(r.left - ir.left) * 0.2;
                      const dist = dy + dx;
                      if (dist < bestDist) {
                          bestDist = dist;
                          ans = dict[raw];
                          foundWord = raw;
                      }
                  }
              }

              if (!ans) {
                  const lines = (document.body.innerText || '').split('\n');
                  for (const line of lines) {
                      const clean = line
                          .trim()
                          .toLowerCase()
                          .replace(/[?.!,]/g, '')
                          .trim();
                      if (clean && clean !== curVal && dict[clean]) {
                          ans = dict[clean];
                          foundWord = clean;
                          break;
                      }
                  }
              }

              if (!ans) return "WAIT_WORD";

              // Prevent double-submitting the exact same input before WocaBee clears the box
              if (curVal === ans.toLowerCase()) {
                  return "SYNCING_POINTS";
              }

              function clickCheckOnce() {
                  const selList = [
                      '#translateWordSubmitBtn',
                      '#submitBtn',
                      '#checkBtn',
                      'button[type="submit"]',
                      '.btn-success'
                  ];
                  for (const s of selList) {
                      const b = document.querySelector(s);
                      if (isVis(b) && !b.disabled) {
                          b.click();
                          return;
                      }
                  }
                  const btns = document.querySelectorAll(
                      'button, a, div.btn, span.btn, input[type="button"], i.fa-check'
                  );
                  for (const b of btns) {
                      if (!isVis(b)) continue;
                      const t = (
                          b.innerText || b.value || b.className || ''
                      ).toLowerCase();
                      if (
                          t.includes('ověřit') ||
                          t.includes('overiť') ||
                          t.includes('check') ||
                          t.includes('submit') ||
                          t.includes('potvrdit') ||
                          t.includes('pokračovat') ||
                          t.includes('continue') ||
                          t.includes('fa-check')
                      ) {
                          b.click();
                          return;
                      }
                  }
                  const ev = {
                      key: 'Enter',
                      code: 'Enter',
                      keyCode: 13,
                      which: 13,
                      bubbles: true
                  };
                  inp.dispatchEvent(new KeyboardEvent('keydown', ev));
                  inp.dispatchEvent(new KeyboardEvent('keyup', ev));
              }

              function setVal(el, val) {
                  const proto = window.HTMLInputElement.prototype;
                  const desc = Object.getOwnPropertyDescriptor(proto, 'value');
                  if (desc && desc.set) {
                      desc.set.call(el, val);
                  } else {
                      el.value = val;
                  }
                  el.dispatchEvent(new Event('input', { bubbles: true }));
                  el.dispatchEvent(new Event('change', { bubbles: true }));
              }

              window._wocaBusy = true;
              inp.focus();
              setVal(inp, '');

              let idx = 0;
              function stepChar() {
                  if (idx < ans.length) {
                      const ch = ans[idx];
                      const sub = ans.substring(0, idx + 1);
                      const kd = {
                          key: ch,
                          char: ch,
                          keyCode: ch.charCodeAt(0),
                          which: ch.charCodeAt(0),
                          bubbles: true
                      };
                      inp.dispatchEvent(new KeyboardEvent('keydown', kd));
                      setVal(inp, sub);
                      inp.dispatchEvent(new KeyboardEvent('keyup', kd));
                      idx++;
                      // Ultra-fast 5ms per character
                      setTimeout(stepChar, 5);
                  } else {
                      setTimeout(function() {
                          clickCheckOnce();
                          setTimeout(function() {
                              window._wocaBusy = false;
                          }, 120);
                      }, 20);
                  }
              }
              stepChar();
              return "FAST: " + foundWord + " -> " + ans;
          })();
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/MainActivity.kt
          package com.example.wocabeehelper

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var statusView: TextView
              private var isRunning = false
              private val handler = Handler(Looper.getMainLooper())
              private var botScript = ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  botScript = resources.openRawResource(R.raw.bot)
                      .bufferedReader()
                      .use { it.readText() }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#212121"))
                      setPadding(10, 10, 10, 10)
                  }

                  val startBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isRunning = true
                          statusView.text = "TURBO ON"
                          loop()
                      }
                  }

                  val stopBtn = Button(this).apply {
                      text = "STOP"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isRunning = false
                          CookieManager.getInstance().flush()
                          statusView.text = "STOPPED & SAVED"
                      }
                  }

                  val syncBtn = Button(this).apply {
                      text = "SAVE"
                      setBackgroundColor(Color.parseColor("#1565C0"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isRunning = false
                          CookieManager.getInstance().flush()
                          webView.reload()
                          Toast.makeText(
                              this@MainActivity,
                              "Synced with WocaBee Server!",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

                  statusView = TextView(this).apply {
                      text = "READY"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(16, 0, 0, 0)
                  }

                  bar.addView(startBtn)
                  bar.addView(stopBtn)
                  bar.addView(syncBtn)
                  bar.addView(statusView)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.databaseEnabled = true
                      settings.cacheMode = WebSettings.LOAD_NO_CACHE
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                  }

                  val cm = CookieManager.getInstance()
                  cm.setAcceptCookie(true)
                  cm.setAcceptThirdPartyCookies(webView, true)

                  webView.loadUrl("https://wocabee.app/app")

                  root.addView(bar, LinearLayout.LayoutParams(-1, -2))
                  root.addView(webView, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
              }

              private fun loop() {
                  if (!isRunning) return
                  webView.evaluateJavascript(botScript) { res ->
                      if (res != null && res != "null" && res != "\"BUSY\"") {
                          statusView.text = res.replace("\"", "")
                      }
                  }
                  CookieManager.getInstance().flush()
                  // Runs every 80ms for maximum server-safe speed
                  handler.postDelayed({ loop() }, 80)
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WocaAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
