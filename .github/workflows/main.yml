name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Create Project Files
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/wocabeehelper
          mkdir -p app/src/main/res/raw

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WocaAuto"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.wocabeehelper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wocabeehelper"
                  minSdk 26
                  targetSdk 34
                  versionCode 10
                  versionName "10.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="WocaAuto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/raw/bot.js
          (function() {
              if (window._wocaBusy) return;
              const dict = {
                  "jedna": "one", "one": "jedna",
                  "dvě": "two", "dve": "two", "two": "dvě",
                  "tři": "three", "tri": "three", "three": "tři",
                  "čtyři": "four", "ctyri": "four", "four": "čtyři",
                  "pět": "five", "pet": "five", "five": "pět",
                  "šest": "six", "sest": "six", "six": "šest",
                  "sedm": "seven", "seven": "sedm",
                  "osm": "eight", "eight": "osm",
                  "devět": "nine", "devet": "nine", "nine": "devět",
                  "deset": "ten", "ten": "deset"
              };

              const allInputs = Array.from(
                  document.querySelectorAll(
                      '#translateWordAnswer, input[type="text"], textarea'
                  )
              ).filter(e =>
                  e.offsetParent !== null &&
                  !e.disabled &&
                  !e.readOnly &&
                  e.type !== 'search'
              );

              if (allInputs.length === 0) return;
              const inp = allInputs[0];
              const ir = inp.getBoundingClientRect();

              let ans = null;
              let bestDist = 999999;

              const qSelectors = [
                  '#translateWordQuestion',
                  '#q_word',
                  '.question-word',
                  '.word-to-translate'
              ];
              for (const sel of qSelectors) {
                  const wq = document.querySelector(sel);
                  if (wq && wq.offsetParent !== null && wq.innerText) {
                      const wc = wq.innerText.trim().toLowerCase();
                      if (dict[wc]) {
                          ans = dict[wc];
                          break;
                      }
                  }
              }

              if (!ans) {
                  const nodes = document.querySelectorAll(
                      'div, span, p, h1, h2, h3, h4, b, strong'
                  );
                  for (const el of nodes) {
                      if (el.offsetParent === null) continue;
                      if (el.children.length > 0) continue;
                      const r = el.getBoundingClientRect();
                      if (r.width === 0 || r.height === 0) continue;
                      const raw = (el.innerText || '')
                          .trim()
                          .toLowerCase()
                          .replace(/[?.!,]/g, '');
                      if (dict[raw]) {
                          const dy = Math.abs(r.bottom - ir.top);
                          const dx = Math.abs(r.left - ir.left) * 0.2;
                          const dist = dy + dx;
                          if (dist < bestDist) {
                              bestDist = dist;
                              ans = dict[raw];
                          }
                      }
                  }
              }

              if (!ans) return;

              function clickCheck() {
                  const btnSels = [
                      '#translateWordSubmitBtn',
                      '#submitBtn',
                      'button[type="submit"]',
                      '.btn-success'
                  ];
                  for (const s of btnSels) {
                      const b = document.querySelector(s);
                      if (b && b.offsetParent !== null && !b.disabled) {
                          b.click();
                          return;
                      }
                  }
                  const btns = document.querySelectorAll(
                      'button, a, div.btn, span.btn, input[type="button"]'
                  );
                  for (const b of btns) {
                      if (b.offsetParent === null) continue;
                      const t = (
                          b.innerText || b.value || b.className || ''
                      ).toLowerCase();
                      if (
                          t.includes('ověřit') ||
                          t.includes('overiť') ||
                          t.includes('check') ||
                          t.includes('submit') ||
                          t.includes('pokračovat') ||
                          t.includes('continue')
                      ) {
                          b.click();
                          return;
                      }
                  }
                  const ev = {
                      key: 'Enter',
                      code: 'Enter',
                      keyCode: 13,
                      which: 13,
                      bubbles: true
                  };
                  inp.dispatchEvent(new KeyboardEvent('keydown', ev));
                  inp.dispatchEvent(new KeyboardEvent('keypress', ev));
                  inp.dispatchEvent(new KeyboardEvent('keyup', ev));
              }

              if (inp.value.trim().toLowerCase() === ans.toLowerCase()) {
                  clickCheck();
                  return;
              }

              window._wocaBusy = true;
              inp.focus();
              inp.value = '';
              let idx = 0;

              function stepChar() {
                  if (idx < ans.length) {
                      inp.value += ans[idx];
                      inp.dispatchEvent(
                          new Event('input', { bubbles: true })
                      );
                      inp.dispatchEvent(
                          new KeyboardEvent('keyup', { bubbles: true })
                      );
                      idx++;
                      setTimeout(stepChar, 25);
                  } else {
                      inp.dispatchEvent(
                          new Event('change', { bubbles: true })
                      );
                      setTimeout(function() {
                          clickCheck();
                          setTimeout(function() {
                              window._wocaBusy = false;
                          }, 300);
                      }, 80);
                  }
              }
              stepChar();
          })();
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/MainActivity.kt
          package com.example.wocabeehelper

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var isRunning = false
              private val handler = Handler(Looper.getMainLooper())
              private var botScript = ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  botScript = resources.openRawResource(R.raw.bot)
                      .bufferedReader()
                      .use { it.readText() }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#212121"))
                      setPadding(12, 12, 12, 12)
                  }

                  val startBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isRunning = true
                          Toast.makeText(
                              this@MainActivity,
                              "BOT STARTED",
                              Toast.LENGTH_SHORT
                          ).show()
                          loop()
                      }
                  }

                  val stopBtn = Button(this).apply {
                      text = "STOP"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isRunning = false
                          Toast.makeText(
                              this@MainActivity,
                              "BOT STOPPED",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

                  bar.addView(startBtn)
                  bar.addView(stopBtn)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      loadUrl("https://wocabee.app/app")
                  }

                  root.addView(bar, LinearLayout.LayoutParams(-1, -2))
                  root.addView(webView, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
              }

              private fun loop() {
                  if (!isRunning) return
                  webView.evaluateJavascript(botScript, null)
                  handler.postDelayed({ loop() }, 200)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WocaAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
