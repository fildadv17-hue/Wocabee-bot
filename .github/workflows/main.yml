name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Create Project Files
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/wocabeehelper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WocaAuto"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.wocabeehelper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wocabeehelper"
                  minSdk 26
                  targetSdk 34
                  versionCode 9
                  versionName "9.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="WocaAuto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WocaAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestEnhancedWebAccessibility"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/MainActivity.kt
          package com.example.wocabeehelper

          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(50, 50, 50, 50)
                  }
                  val status = TextView(this).apply {
                      text = "WocaAuto (1-10 + Auto Check)\nStatus: STOPPED"
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  val startBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          WocaAccessibilityService.isAutoRunning = true
                          status.text = "Status: RUNNING"
                      }
                  }
                  val stopBtn = Button(this).apply {
                      text = "STOP"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          WocaAccessibilityService.isAutoRunning = false
                          status.text = "Status: STOPPED"
                      }
                  }
                  val accBtn = Button(this).apply {
                      text = "OPEN ACCESSIBILITY SETTINGS"
                      setOnClickListener {
                          val i = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          startActivity(i)
                      }
                  }
                  layout.addView(status)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  layout.addView(accBtn)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/WocaAccessibilityService.kt
          package com.example.wocabeehelper

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import kotlin.math.abs

          class WocaAccessibilityService : AccessibilityService() {
              companion object {
                  var isAutoRunning = false
                  val dictionary = mapOf(
                      "jedna" to "one", "one" to "jedna",
                      "dvě" to "two", "dve" to "two", "two" to "dvě",
                      "tři" to "three", "tri" to "three", "three" to "tři",
                      "čtyři" to "four", "ctyri" to "four", "four" to "čtyři",
                      "pět" to "five", "pet" to "five", "five" to "pět",
                      "šest" to "six", "sest" to "six", "six" to "šest",
                      "sedm" to "seven", "seven" to "sedm",
                      "osm" to "eight", "eight" to "osm",
                      "devět" to "nine", "devet" to "nine", "nine" to "devět",
                      "deset" to "ten", "ten" to "deset"
                  )
              }

              private lateinit var wm: WindowManager
              private lateinit var btn: Button
              private val handler = Handler(Looper.getMainLooper())
              private var typing = false

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 300
                  }
                  btn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                      var moved = false
                      setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  ix = p.x; iy = p.y
                                  tx = ev.rawX; ty = ev.rawY
                                  moved = false; true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (ev.rawX - tx).toInt()
                                  val dy = (ev.rawY - ty).toInt()
                                  if (abs(dx) > 10 || abs(dy) > 10) moved = true
                                  p.x = ix + dx; p.y = iy + dy
                                  wm.updateViewLayout(this, p); true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) performClick()
                                  true
                              }
                              else -> false
                          }
                      }
                      setOnClickListener {
                          isAutoRunning = !isAutoRunning
                          syncUI()
                      }
                  }
                  wm.addView(btn, p)
                  loop()
              }

              private fun syncUI() {
                  btn.text = if (isAutoRunning) "STOP" else "START"
                  val c = if (isAutoRunning) "#C62828" else "#2E7D32"
                  btn.setBackgroundColor(Color.parseColor(c))
              }

              private fun loop() {
                  syncUI()
                  if (isAutoRunning && !typing) {
                      rootInActiveWindow?.let { solve(it) }
                  }
                  handler.postDelayed({ loop() }, 180)
              }

              private fun clickUp(n: AccessibilityNodeInfo?) {
                  var c = n
                  while (c != null) {
                      if (c.isClickable) {
                          c.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          return
                      }
                      c = c.parent
                  }
                  n?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              private fun solve(root: AccessibilityNodeInfo) {
                  val cands = mutableListOf<Pair<String, Rect>>()
                  var inp: AccessibilityNodeInfo? = null
                  var sub: AccessibilityNodeInfo? = null
                  var belowBtn: AccessibilityNodeInfo? = null
                  val ir = Rect()

                  fun findInp(n: AccessibilityNodeInfo?) {
                      if (n == null) return
                      val cls = n.className?.toString() ?: ""
                      if ((n.isEditable || cls.contains("EditText")) &&
                          n.isVisibleToUser
                      ) {
                          inp = n
                          n.getBoundsInScreen(ir)
                      }
                      for (i in 0 until n.childCount) {
                          findInp(n.getChild(i))
                      }
                  }
                  findInp(root)
                  val target = inp ?: return
                  val cur = target.text?.toString()?.trim()?.lowercase() ?: ""

                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null || !n.isVisibleToUser || n == target) return
                      val t = (n.text?.toString()
                          ?: n.contentDescription?.toString() ?: "").trim()
                      val id = (n.viewIdResourceName ?: "").lowercase()
                      val r = Rect()
                      n.getBoundsInScreen(r)

                      if (t.isNotEmpty()) {
                          val cl = t.lowercase()
                              .replace("?", "")
                              .replace("!", "")
                              .replace(".", "")
                              .trim()
                          if (cl != cur && dictionary.containsKey(cl)) {
                              cands.add(Pair(cl, r))
                          }
                          if (t.contains("Check", true) ||
                              t.contains("Submit", true) ||
                              t.contains("Ověřit", true) ||
                              t.contains("Overiť", true) ||
                              t.contains("Pokračovat", true) ||
                              t.contains("Continue", true) ||
                              id.contains("submit") ||
                              id.contains("check")
                          ) {
                              sub = n
                          }
                      }
                      val cls = n.className?.toString() ?: ""
                      if ((n.isClickable || cls.contains("Button")) &&
                          r.top >= ir.bottom - 20 &&
                          r.top < ir.bottom + 450
                      ) {
                          if (belowBtn == null) belowBtn = n
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(root)

                  val best = cands.minByOrNull { (_, r) ->
                      abs(r.bottom - ir.top) + abs(r.left - ir.left) / 4
                  }?.first ?: return

                  val ans = dictionary[best] ?: return
                  val checkBtn = sub ?: belowBtn

                  if (cur == ans.lowercase()) {
                      clickUp(checkBtn)
                      if (Build.VERSION.SDK_INT >= 30) {
                          val act = AccessibilityNodeInfo
                              .AccessibilityAction.ACTION_IME_ENTER.id
                          target.performAction(act)
                      }
                      return
                  }
                  typeWord(target, ans, checkBtn)
              }

              private fun typeWord(
                  inp: AccessibilityNodeInfo,
                  w: String,
                  sub: AccessibilityNodeInfo?
              ) {
                  typing = true
                  inp.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  inp.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  for (i in 1..w.length) {
                      val part = w.substring(0, i)
                      handler.postDelayed({
                          val b = Bundle()
                          val k = AccessibilityNodeInfo
                              .ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE
                          b.putCharSequence(k, part)
                          val act = AccessibilityNodeInfo.ACTION_SET_TEXT
                          inp.performAction(act, b)
                          if (i == w.length) {
                              handler.postDelayed({
                                  clickUp(sub)
                                  if (Build.VERSION.SDK_INT >= 30) {
                                      val ime = AccessibilityNodeInfo
                                          .AccessibilityAction
                                          .ACTION_IME_ENTER.id
                                      inp.performAction(ime)
                                  }
                              }, 80)
                              handler.postDelayed({ typing = false }, 400)
                          }
                      }, (i * 25).toLong())
                  }
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WocaAuto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
