name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create Android Project Files
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/wocabeehelper
          mkdir -p app/src/main/res/xml

          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WocaAuto"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.wocabeehelper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wocabeehelper"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "5.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="WocaAuto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WocaAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestEnhancedWebAccessibility"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/MainActivity.kt
          package com.example.wocabeehelper

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var isBotRunning = false
              private val handler = Handler(Looper.getMainLooper())

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#212121"))
                      setPadding(12, 12, 12, 12)
                  }
                  val startBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isBotRunning = true
                          WocaAccessibilityService.isAutoRunning = true
                          Toast.makeText(this@MainActivity, "STARTED", Toast.LENGTH_SHORT).show()
                          runWebBotLoop()
                      }
                  }
                  val stopBtn = Button(this).apply {
                      text = "STOP"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isBotRunning = false
                          WocaAccessibilityService.isAutoRunning = false
                          Toast.makeText(this@MainActivity, "STOPPED", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val overlayBtn = Button(this).apply {
                      text = "OVERLAY"
                      setBackgroundColor(Color.parseColor("#1565C0"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  topBar.addView(startBtn)
                  topBar.addView(stopBtn)
                  topBar.addView(overlayBtn)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      loadUrl("https://wocabee.app/app")
                  }
                  mainLayout.addView(topBar, LinearLayout.LayoutParams(-1, -2))
                  mainLayout.addView(webView, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(mainLayout)
              }

              private fun runWebBotLoop() {
                  if (!isBotRunning) return
                  val js = """
                  (function(){
                      if (window._wt) return;
                      const d = {
                          'jedna':'one','one':'jedna',
                          'dvě':'two','dve':'two','two':'dvě',
                          'tři':'three','tri':'three','three':'tři',
                          'čtyři':'four','ctyri':'four','four':'čtyři',
                          'pět':'five','pet':'five','five':'pět',
                          'šest':'six','sest':'six','six':'šest',
                          'sedm':'seven','seven':'sedm',
                          'osm':'eight','eight':'osm',
                          'devět':'nine','devet':'nine','nine':'devět',
                          'deset':'ten','ten':'deset'
                      };
                      const inp = Array.from(document.querySelectorAll('#translateWordAnswer, input[type=text], textarea, input:not([type])'))
                          .filter(e => e.offsetParent !== null && !e.disabled && !e.readOnly)[0];
                      if (!inp) return;

                      const inpRect = inp.getBoundingClientRect();
                      let bestAns = null;
                      let bestDist = 999999;

                      // 1. Check dedicated WocaBee question selectors first
                      const wocaQ = document.querySelector('#translateWordQuestion, #q_word, .question-word, .word-to-translate, #wordToTranslate');
                      if (wocaQ && wocaQ.offsetParent !== null && wocaQ.innerText) {
                          const wClean = wocaQ.innerText.trim().toLowerCase().replace(/[^a-záčďéěíňóřšťúůýž]/g, '');
                          if (d[wClean]) bestAns = d[wClean];
                      }

                      // 2. Otherwise pick the visible dictionary word physically closest to the input box
                      if (!bestAns) {
                          const allEls = document.querySelectorAll('div, span, p, h1, h2, h3, h4, b, strong, label');
                          for (const el of allEls) {
                              if (el.offsetParent === null) continue;
                              const r = el.getBoundingClientRect();
                              if (r.width === 0 || r.height === 0) continue;
                              const raw = (el.innerText || '').trim().toLowerCase().replace(/[?.!,]/g, '');
                              if (d[raw]) {
                                  const dist = Math.abs(r.bottom - inpRect.top) + Math.abs(r.left - inpRect.left) * 0.2;
                                  if (dist < bestDist) {
                                      bestDist = dist;
                                      bestAns = d[raw];
                                  }
                              }
                          }
                      }

                      if (bestAns && inp.value !== bestAns) {
                          window._wt = true;
                          inp.focus();
                          const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                          if (setter) setter.call(inp, ''); else inp.value = '';
                          inp.dispatchEvent(new Event('input', {bubbles:true}));

                          let i = 0;
                          function tc() {
                              if (i < bestAns.length) {
                                  const nextVal = bestAns.substring(0, i + 1);
                                  if (setter) setter.call(inp, nextVal); else inp.value = nextVal;
                                  inp.dispatchEvent(new KeyboardEvent('keydown', {key: bestAns[i], bubbles:true}));
                                  inp.dispatchEvent(new Event('input', {bubbles:true}));
                                  inp.dispatchEvent(new KeyboardEvent('keyup', {key: bestAns[i], bubbles:true}));
                                  i++;
                                  setTimeout(tc, 25);
                              } else {
                                  inp.dispatchEvent(new Event('change', {bubbles:true}));
                                  setTimeout(() => {
                                      // Click Check / Ověřit button
                                      const checkSelectors = [
                                          '#translateWordSubmitBtn',
                                          '#submitBtn',
                                          'button[type=submit]',
                                          'input[type=submit]',
                                          '.btn-success',
                                          '.btn-primary'
                                      ];
                                      let clicked = false;
                                      for (const sel of checkSelectors) {
                                          const btn = Array.from(document.querySelectorAll(sel)).find(b => b.offsetParent !== null && !b.disabled);
                                          if (btn) { btn.click(); clicked = true; break; }
                                      }
                                      if (!clicked) {
                                          const allBtns = Array.from(document.querySelectorAll('button, a.btn, div.btn, span.btn, i.fa-check')).filter(b => b.offsetParent !== null);
                                          for (const b of allBtns) {
                                              const t = (b.innerText || b.value || b.title || b.className || '').toLowerCase();
                                              if (t.includes('ověřit') || t.includes('overiť') || t.includes('check') || t.includes('submit') || t.includes('enter') || t.includes('pokračovat') || t.includes('continue') || t.includes('další')) {
                                                  b.click();
                                                  clicked = true;
                                                  break;
                                              }
                                          }
                                      }
                                      // Also fire Enter key + Form submit
                                      const enterOpts = {key:'Enter', code:'Enter', keyCode:13, which:13, bubbles:true, cancelable:true};
                                      inp.dispatchEvent(new KeyboardEvent('keydown', enterOpts));
                                      inp.dispatchEvent(new KeyboardEvent('keypress', enterOpts));
                                      inp.dispatchEvent(new KeyboardEvent('keyup', enterOpts));
                                      if (inp.form) inp.form.dispatchEvent(new Event('submit', {bubbles:true, cancelable:true}));
                                      setTimeout(() => { window._wt = false; }, 350);
                                  }, 80);
                              }
                          }
                          tc();
                      }
                  })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
                  handler.postDelayed({ runWebBotLoop() }, 200)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/WocaAccessibilityService.kt
          package com.example.wocabeehelper

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import kotlin.math.abs

          class WocaAccessibilityService : AccessibilityService() {
              companion object {
                  var isAutoRunning = false
                  val dictionary = mutableMapOf(
                      "jedna" to "one", "one" to "jedna",
                      "dvě" to "two", "dve" to "two", "two" to "dvě",
                      "tři" to "three", "tri" to "three", "three" to "tři",
                      "čtyři" to "four", "ctyri" to "four", "four" to "čtyři",
                      "pět" to "five", "pet" to "five", "five" to "pět",
                      "šest" to "six", "sest" to "six", "six" to "šest",
                      "sedm" to "seven", "seven" to "sedm",
                      "osm" to "eight", "eight" to "osm",
                      "devět" to "nine", "devet" to "nine", "nine" to "devět",
                      "deset" to "ten", "ten" to "deset"
                  )
              }
              private lateinit var windowManager: WindowManager
              private lateinit var overlayButton: Button
              private val handler = Handler(Looper.getMainLooper())
              private var isCurrentlyTyping = false
              private var lastTypedAnswer = ""
              private var lastPromptWord = ""

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 300
                  }
                  overlayButton = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f; var moved = false
                      setOnTouchListener { _, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { initialX = params.x; initialY = params.y; touchX = event.rawX; touchY = event.rawY; moved = false; true }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (event.rawX - touchX).toInt(); val dy = (event.rawY - touchY).toInt()
                                  if (abs(dx) > 10 || abs(dy) > 10) moved = true
                                  params.x = initialX + dx; params.y = initialY + dy
                                  windowManager.updateViewLayout(this, params); true
                              }
                              MotionEvent.ACTION_UP -> { if (!moved) performClick(); true }
                              else -> false
                          }
                      }
                      setOnClickListener {
                          isAutoRunning = !isAutoRunning
                          lastPromptWord = ""
                          updateButtonAppearance()
                      }
                  }
                  windowManager.addView(overlayButton, params)
                  startStateSyncLoop()
              }

              private fun updateButtonAppearance() {
                  overlayButton.text = if (isAutoRunning) "ST
