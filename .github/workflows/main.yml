name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create Android Project Files
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/wocabeehelper
          mkdir -p app/src/main/res/xml

          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WocaAuto"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.wocabeehelper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wocabeehelper"
                  minSdk 26
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="WocaAuto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WocaAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestEnhancedWebAccessibility"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/MainActivity.kt
          package com.example.wocabeehelper

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var isBotRunning = false
              private val handler = Handler(Looper.getMainLooper())

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#212121"))
                      setPadding(12, 12, 12, 12)
                  }
                  val startBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isBotRunning = true
                          WocaAccessibilityService.isAutoRunning = true
                          Toast.makeText(this@MainActivity, "STARTED", Toast.LENGTH_SHORT).show()
                          runWebBotLoop()
                      }
                  }
                  val stopBtn = Button(this).apply {
                      text = "STOP"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isBotRunning = false
                          WocaAccessibilityService.isAutoRunning = false
                          Toast.makeText(this@MainActivity, "STOPPED", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val overlayBtn = Button(this).apply {
                      text = "OVERLAY"
                      setBackgroundColor(Color.parseColor("#1565C0"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  topBar.addView(startBtn)
                  topBar.addView(stopBtn)
                  topBar.addView(overlayBtn)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      loadUrl("https://wocabee.app/app")
                  }
                  mainLayout.addView(topBar, LinearLayout.LayoutParams(-1, -2))
                  mainLayout.addView(webView, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(mainLayout)
              }

              private fun runWebBotLoop() {
                  if (!isBotRunning) return
                  val js = "javascript:(function(){if(window._wt)return;const d={'jedna':'one','one':'jedna','dvě':'two','dve':'two','two':'dvě','tři':'three','tri':'three','three':'tři','čtyři':'four','ctyri':'four','four':'čtyři','pět':'five','pet':'five','five':'pět','šest':'six','sest':'six','six':'šest','sedm':'seven','seven':'sedm','osm':'eight','eight':'osm','devět':'nine','devet':'nine','nine':'devět','deset':'ten','ten':'deset'};const inp=Array.from(document.querySelectorAll('#translateWordAnswer,input[type=text],textarea,input:not([type])')).filter(e=>e.offsetParent!==null&&!e.disabled)[0];if(!inp)return;const ir=inp.getBoundingClientRect();let ans=null;let bd=999999;const wq=document.querySelector('#translateWordQuestion,#q_word,.question-word,.word-to-translate');if(wq&&wq.offsetParent!==null&&wq.innerText){const wc=wq.innerText.trim().toLowerCase();if(d[wc])ans=d[wc];}if(!ans){for(const el of document.querySelectorAll('div,span,p,h1,h2,h3,h4,b,strong')){if(el.offsetParent===null||el.children.length>0)continue;const r=el.getBoundingClientRect();if(r.width===0||r.height===0)continue;const raw=(el.innerText||'').trim().toLowerCase().replace(/[?.!,]/g,'');if(d[raw]){const dist=Math.abs(r.bottom-ir.top)+Math.abs(r.left-ir.left)*0.2;if(dist<bd){bd=dist;ans=d[raw];}}}}if(ans&&inp.value!==ans){window._wt=true;inp.focus();inp.value='';let i=0;function tc(){if(i<ans.length){inp.value+=ans[i];inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new KeyboardEvent('keyup',{bubbles:true}));i++;setTimeout(tc,25);}else{inp.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>{const sb=document.querySelector('#translateWordSubmitBtn,#submitBtn,button[type=submit],.btn-success');if(sb&&sb.offsetParent!==null){sb.click();}else{for(const b of document.querySelectorAll('button,a,div.btn,span.btn')){if(b.offsetParent===null)continue;const t=(b.innerText||b.value||b.className||'').toLowerCase();if(t.includes('ověřit')||t.includes('overiť')||t.includes('check')||t.includes('submit')||t.includes('pokračovat')||t.includes('continue')){b.click();break;}}}inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true}));setTimeout(()=>{window._wt=false;},350);},80);}}tc();}})();"
                  webView.evaluateJavascript(js, null)
                  handler.postDelayed({ runWebBotLoop() }, 200)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/WocaAccessibilityService.kt
          package com.example.wocabeehelper

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import kotlin.math.abs

          class WocaAccessibilityService : AccessibilityService() {
              companion object {
                  var isAutoRunning = false
                  val dictionary = mutableMapOf(
                      "jedna" to "one", "one" to "jedna",
                      "dvě" to "two", "dve" to "two", "two" to "dvě",
                      "tři" to "three", "tri" to "three", "three" to "tři",
                      "čtyři" to "four", "ctyri" to "four", "four" to "čtyři",
                      "pět" to "five", "pet" to "five", "five" to "pět",
                      "šest" to "six", "sest" to "six", "six" to "šest",
                      "sedm" to "seven", "seven" to "sedm",
                      "osm" to "eight", "eight" to "osm",
                      "devět" to "nine", "devet" to "nine", "nine" to "devět",
                      "deset" to "ten", "ten" to "deset"
                  )
              }
              private lateinit var windowManager: WindowManager
              private lateinit var overlayButton: Button
              private val handler = Handler(Looper.getMainLooper())
              private var isCurrentlyTyping = false

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 300
                  }
                  overlayButton = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f; var moved = false
                      setOnTouchListener { _, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { initialX = params.x; initialY = params.y; touchX = event.rawX; touchY = event.rawY; moved = false; true }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (event.rawX - touchX).toInt(); val dy = (event.rawY - touchY).toInt()
                                  if (abs(dx) > 10 || abs(dy) > 10) moved = true
                                  params.x = initialX + dx; params.y = initialY + dy
                                  windowManager.updateViewLayout(this, params); true
                              }
                              MotionEvent.ACTION_UP -> { if (!moved) performClick(); true }
                              else -> false
                          }
                      }
                      setOnClickListener {
                          isAutoRunning = !isAutoRunning
                          updateButtonAppearance()
                      }
                  }
                  windowManager.addView(overlayButton, params)
                  startStateSyncLoop()
              }

              private fun updateButtonAppearance() {
                  overlayButton.text = if (isAutoRunning) "STOP" else "START"
                  overlayButton.setBackgroundColor(Color.parseColor(if (isAutoRunning) "#C62828" else "#2E7D32"))
              }

              private fun startStateSyncLoop() {
                  updateButtonAppearance()
                  if (isAutoRunning && !isCurrentlyTyping) {
                      rootInActiveWindow?.let { solveScreen(it) }
                  }
                  handler.postDelayed({ startStateSyncLoop() }, 180)
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo?) {
                  var curr = node
                  while (curr != null) {
                      if (curr.isClickable) {
                          curr.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          return
                      }
                      curr = curr.parent
                  }
                  node?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              private fun solveScreen(rootNode: AccessibilityNodeInfo) {
                  val candidates = mutableListOf<Pair<String, Rect>>()
                  var inputNode: AccessibilityNodeInfo? = null
                  var submitButton: AccessibilityNodeInfo? = null
                  var fallbackButtonBelowInput: AccessibilityNodeInfo? = null
                  val inputRect = Rect()

                  fun findInput(node: AccessibilityNodeInfo?) {
                      if (node == null) return
                      val cls = node.className?.toString() ?: ""
                      if ((node.isEditable || cls.contains("EditText")) && node.isVisibleToUser) {
                          inputNode = node
                          node.getBoundsInScreen(inputRect)
                      }
                      for (i in 0 until node.childCount) findInput(node.getChild(i))
                  }
                  findInput(rootNode)
                  val targetInput = inputNode ?: return
                  val currentInputText = targetInput.text?.toString()?.trim()?.lowercase() ?: ""

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser || node == targetInput) return
                      val rawText = (node.text?.toString() ?: node.contentDescription?.toString() ?: "").trim()
                      val idName = (node.viewIdResourceName ?: "").lowercase()
                      val rect = Rect()
                      node.getBoundsInScreen(rect)

                      if (rawText.isNotEmpty()) {
                          val clean = rawText.lowercase().replace("?", "").replace("!", "").replace(".", "").trim()
                          if (clean != currentInputText && dictionary.containsKey(clean)) {
                              candidates.add(Pair(clean, rect))
                          }
                          if (rawText.contains("Check", true) || rawText.contains("Submit", true) || rawText.contains("Ověřit", true) || rawText.contains("Overiť", true) || rawText.contains("Pokračovat", true) || rawText.contains("Continue", true) || idName.contains("submit") || idName.contains("check")) {
                              submitButton = node
                          }
                      }

                      val cls = node.className?.toString() ?: ""
                      if ((node.isClickable || cls.contains("Button")) && rect.top >= inputRect.bottom - 20 && rect.top < inputRect.bottom + 450) {
                          if (fallbackButtonBelowInput == null) fallbackButtonBelowInput = node
                      }
                      for (i in 0 until node.childCount) traverse(node.getChild(i))
                  }
                  traverse(rootNode)

                  val bestPrompt = candidates.minByOrNull { (_, r) ->
                      abs(r.bottom - inputRect.top) + abs(r.left - inputRect.left) / 4
                  }?.first ?: return

                  val answer = dictionary[bestPrompt] ?: return
                  val finalSubmitBtn = submitButton ?: fallbackButtonBelowInput

                  if (currentInputText == answer.lowercase()) {
                      clickNodeOrParent(finalSubmitBtn)
                      if (Build.VERSION.SDK_INT >= 30) {
                          targetInput.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                      }
                      return
                  }
                  typeFast(targetInput, answer, finalSubmitBtn)
              }

              private fun typeFast(inputNode: AccessibilityNodeInfo, word: String, submitButton: AccessibilityNodeInfo?) {
                  isCurrentlyTyping = true
                  inputNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  inputNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)

   
