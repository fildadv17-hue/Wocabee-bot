name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate WocaAuto Project (1-10 Preloaded + Direct Auto-Typer)
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/wocabeehelper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WocaAuto"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.wocabeehelper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.wocabeehelper"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="WocaAuto"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WocaAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestEnhancedWebAccessibility"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/MainActivity.kt
          package com.example.wocabeehelper

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var isBotRunning = false
              private val handler = Handler(Looper.getMainLooper())

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#212121"))
                      setPadding(16, 16, 16, 16)
                  }

                  val startBtn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                  }

                  val stopBtn = Button(this).apply {
                      text = "STOP"
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setTextColor(Color.WHITE)
                  }

                  val overlayBtn = Button(this).apply {
                      text = "OVERLAY"
                      setBackgroundColor(Color.parseColor("#1565C0"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }

                  startBtn.setOnClickListener {
                      isBotRunning = true
                      WocaAccessibilityService.isAutoRunning = true
                      Toast.makeText(this, "Auto-Typer STARTED (1-10)", Toast.LENGTH_SHORT).show()
                      runWebBotLoop()
                  }

                  stopBtn.setOnClickListener {
                      isBotRunning = false
                      WocaAccessibilityService.isAutoRunning = false
                      Toast.makeText(this, "Auto-Typer STOPPED", Toast.LENGTH_SHORT).show()
                  }

                  topBar.addView(startBtn)
                  topBar.addView(stopBtn)
                  topBar.addView(overlayBtn)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      loadUrl("https://wocabee.app/app")
                  }

                  mainLayout.addView(topBar, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ))
                  mainLayout.addView(webView, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0,
                      1f
                  ))

                  setContentView(mainLayout)
              }

              private fun runWebBotLoop() {
                  if (!isBotRunning) return

                  val jsCode = """
                  (function() {
                      const dict = {
                          "jedna": "one", "one": "jedna",
                          "dvě": "two", "dve": "two", "two": "dvě",
                          "tři": "three", "tri": "three", "three": "tři",
                          "čtyři": "four", "ctyri": "four", "four": "čtyři",
                          "pět": "five", "pet": "five", "five": "pět",
                          "šest": "six", "sest": "six", "six": "šest",
                          "sedm": "seven", "seven": "sedm",
                          "osm": "eight", "eight": "osm",
                          "devět": "nine", "devet": "nine", "nine": "devět",
                          "deset": "ten", "ten": "deset"
                      };

                      // Find any visible input field
                      const inputs = Array.from(document.querySelectorAll('input[type="text"], textarea, input:not([type])'))
                          .filter(el => el.offsetParent !== null);
                      if (inputs.length === 0) return;
                      const input = inputs[0];

                      // Scan page elements for matching prompt word
                      const elements = Array.from(document.querySelectorAll('div, span, p, h1, h2, h3, h4, b, strong'));
                      let answer = null;
                      for (const el of elements) {
                          if (el.children.length === 0 && el.innerText) {
                              const clean = el.innerText.trim().toLowerCase();
                              if (dict[clean]) {
                                  answer = dict[clean];
                                  break;
                              }
                          }
                      }

                      if (answer && input.value !== answer && !window.__wocaTyping) {
                          window.__wocaTyping = true;
                          input.focus();
                          input.value = "";
                          let i = 0;
                          function typeChar() {
                              if (i < answer.length) {
                                  input.value += answer[i];
                                  input.dispatchEvent(new Event('input', { bubbles: true }));
                                  input.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true }));
                                  i++;
                                  setTimeout(typeChar, 20);
                              } else {
                                  input.dispatchEvent(new Event('change', { bubbles: true }));
                                  setTimeout(() => {
                                      const btns = Array.from(document.querySelectorAll('button, a, input[type="submit"]'));
                                      for (const b of btns) {
                                          const t = (b.innerText || b.value || "").toLowerCase();
                                          if (t.includes("ověřit") || t.includes("overiť") || t.includes("check") || t.includes("submit") || b.id.toLowerCase().includes("submit") || b.className.toLowerCase().includes("submit")) {
                                              b.click();
                                              break;
                                          }
                                      }
                                      // Also simulate Enter key
                                      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true }));
                                      window.__wocaTyping = false;
                                  }, 60);
                              }
                          }
                          typeChar();
                      }
                  })();
                  """.trimIndent()

                  webView.evaluateJavascript(jsCode, null)
                  handler.postDelayed({ runWebBotLoop() }, 250)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/wocabeehelper/WocaAccessibilityService.kt
          package com.example.wocabeehelper

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button

          class WocaAccessibilityService : AccessibilityService() {

              companion object {
                  var isAutoRunning = false
                  val dictionary = mutableMapOf(
                      "jedna" to "one", "one" to "jedna",
                      "dvě" to "two", "dve" to "two", "two" to "dvě",
                      "tři" to "three", "tri" to "three", "three" to "tři",
                      "čtyři" to "four", "ctyri" to "four", "four" to "čtyři",
                      "pět" to "five", "pet" to "five", "five" to "pět",
                      "šest" to "six", "sest" to "six", "six" to "šest",
                      "sedm" to "seven", "seven" to "sedm",
                      "osm" to "eight", "eight" to "osm",
                      "devět" to "nine", "devet" to "nine", "nine" to "devět",
                      "deset" to "ten", "ten" to "deset"
                  )
              }

              private lateinit var windowManager: WindowManager
              private lateinit var overlayButton: Button
              private val handler = Handler(Looper.getMainLooper())
              private var isCurrentlyTyping = false

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 300
                  }

                  overlayButton = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)

                      var initialX = 0
                      var initialY = 0
                      var touchX = 0f
                      var touchY = 0f
                      var moved = false

                      setOnTouchListener { _, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  touchX = event.rawX
                                  touchY = event.rawY
                                  moved = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (event.rawX - touchX).toInt()
                                  val dy = (event.rawY - touchY).toInt()
                                  if (kotlin.math.abs(dx) > 10 || kotlin.math.abs(dy) > 10) moved = true
                                  params.x = initialX + dx
                                  params.y = initialY + dy
                                  windowManager.updateViewLayout(this, params)
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) performClick()
                                  true
                              }
                              else -> false
                          }
                      }

                      setOnClickListener {
                          isAutoRunning = !isAutoRunning
                          updateButtonAppearance()
                      }
                  }

                  windowManager.addView(overlayButton, params)
                  startStateSyncLoop()
              }

              private fun updateButtonAppearance() {
                  if (isAutoRunning) {
                      overlayButton.text = "STOP"
                      overlayButton.setBackgroundColor(Color.parseColor("#C62828"))
                  } else {
                      overlayButton.text = "START"
                      overlayButton.setBackgroundColor(Color.parseColor("#2E7D32"))
                  }
              }

              private fun startStateSyncLoop() {
                  updateButtonAppearance()
                  if (isAutoRunning && !isCurrentlyTyping) {
                      val root = rootInActiveWindow
                      if (root != null) solveScreen(root)
                  }
                  handler.postDelayed({ startStateSyncLoop() }, 200)
              }

              private fun solveScreen(rootNode: AccessibilityNodeInfo) {
                  val allTextNodes = mutableListOf<String>()
                  var inputNode: AccessibilityNodeInfo? = null
                  var submitButton: AccessibilityNodeInfo? = null

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null) return
                      val cls = node.className?.toString() ?: ""
                      if (node.isEditable || cls.contains("EditText")) {
                          inputNode = node
                      }
                      val rawText = node.text?.toString()?.trim() ?: node.contentDescription?.toString()?.trim() ?: ""
                      if (rawText.isNotEmpty()) {
                          allTextNodes.add(rawText)
                          if (rawText.equals("Check", ignoreCase = true) ||
                              rawText.equals("Submit", ignoreCase = true) ||
                              rawText.equals("Ověřit", ignoreCase = true) ||
                              rawText.equals("Overiť", ignoreCase = true)
                          ) {
                              submitButton = node
                          }
                      }
                      for (i in 0 until node.childCount) {
                          traverse(node.getChild(i))
                      }
                  }

                  traverse(rootNode)

                  val targetInput = inputNode ?: return
                  for (screenText in allTextNodes) {
                      val cleanPrompt = screenText.lowercase()
                      val answer = dictionary[cleanPrompt]
                      if (answer != null) {
                          typeFast(targetInput, answer, submitButton)
                          break
                      }
                  }
              }

              private fun typeFast(
                  inputNode: AccessibilityNodeInfo,
                  word: String,
             
